name: ci

on:
  push:
  pull_request:

jobs:
  # Windows：主要開發平台，跑 analyze + 全量測試
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Windows 發布編譯：保證桌面端可打包，產物上傳為 artifact 供檢查。
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release

  # Android：release APK 驗證可編譯可安裝（無正式 keystore 時
  # 用 debug key 簽名：adb 可直接裝，僅上架 Play 才需正式簽名）。
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # iOS：macos-14 保證可編譯（flutter build ios 預設即 release）。
  # 不需要簽名證書/描述檔（--no-codesign），產物上傳為 artifact 供檢查。
  # 注意：未簽名的 .app/IPA 裝不上真機（只能跑模擬器）。
  # 真機安裝二選一：
  #   (a) 免費 Apple ID：本地用 Sideloadly/AltStore 重簽下面的
  #       unsigned IPA 再裝（7 天有效期，到期重簽）；
  #   (b) 付費開發者帳號：把 P12＋provisioning profile 存成 Secrets，
  #       CI 改走簽名後 flutter build ipa＋TestFlight。
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --no-codesign
      - name: Package unsigned IPA (for local re-sign)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/*.app Payload/
          zip -r build/unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/unsigned.ipa

  # Linux：analyze + 測試 + 冒煙編譯，驗證無平台依賴
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux
